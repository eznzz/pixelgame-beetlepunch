e==='Space'&&e.target.tagName!=='SELECT'){e.preventDefault();if(!e.repeat)attack()}});const demo=document.querySelector('#demo').getContext('2d');function loop(now){if(!paused)t+=Math.min(now-last,100);last=now;for(const {a,ctx} of items){ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.imageSmoothingEnabled=false;drawFrame(ctx,a,(Math.floor(t*a.fps/1000)+manual)%a.frames.length,0,0,reverse)}demo.clearRect(0,0,320,180);demo.imageSmoothingEnabled=false;demo.fillStyle='#374358';demo.fillRect(0,145,320,2);const hero=data.characters.hero,enemy=data.characters[document.querySelector('#enemy').value],fx=data.effects.punch,elapsed=attackAt===null?-1:now-attackAt,impact=2*1000/hero.punch.fps,hit=elapsed>=impact,done=elapsed>=impact+400;let ha=elapsed>=0&&elapsed<1000*hero.punch.frames.length/hero.punch.fps?hero.punch:hero.idle,hi=ha===hero.punch?Math.floor(elapsed*ha.fps/1000):Math.floor(t*ha.fps/1000)%ha.frames.length;const hx=reverse?160:80,ex=reverse?115:125;drawFrame(demo,ha,hi,hx,86,reverse);if(!done){let off=hit?Math.min(18,(elapsed-impact)/14):0;drawFrame(demo,hit?enemy.hit:enemy.run,hit?Math.min(2,Math.floor((elapsed-impact)*enemy.hit.fps/1000)):Math.floor(t*enemy.run.fps/1000)%6,ex+(reverse?-off:off),86,!reverse)}if(hit&&elapsed-impact<fx.durationMs){const index=Math.floor((elapsed-impact)*fx.fps/1000);drawFrame(demo,fx,index,(reverse?170:141)-32,114-32,false);document.querySelector('#status').textContent='ПОПАДАНИЕ'}else if(done)document.querySelector('#status').textContent='Противник устранён — нажми удар для повтора';requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
